# =============================================================================
# AHM — Evaluation Campaign (Non-atomic Twin)
#
# Split out of ahm-execution-helix.yml on 2026-08-29, right before the §4.3
# determinism campaign's first real launch (docs/superpowers/specs/2026-07-23-
# atomic-testing-evaluation-campaign-design.md). Runs ONLY the paper's
# non-atomic-twin evaluation artifact (`evaluation/non-atomic-twin/`,
# docs/paper/atomic-testing-formal-definition.md §3.2-§4) — never the
# reference implementation's own atomic test suite, which stays on
# ahm-execution-helix.yml.
#
# Why a separate file instead of leaving these jobs on the shared workflow:
# ahm-execution-helix.yml has a workflow-level `concurrency: {group:
# helix-${{ github.ref }}, cancel-in-progress: true}`. While the twin jobs
# lived there, an ordinary CI dispatch (platform=all/web/android/...) firing
# while a campaign dispatch was in flight would CANCEL the campaign run
# outright — and a campaign dispatch would just as easily cancel someone's
# ordinary CI run. Both directions were real risk for a multi-day, strictly
# sequential 120-dispatch campaign. This file's own, independent concurrency
# group removes that cross-contamination entirely: the two workflows can
# never cancel each other. (The campaign's own atomic-web/atomic-android legs
# still dispatch against ahm-execution-helix.yml — see
# scripts/experiments/lib/campaign-matrix.ts's WORKFLOW_FILE map — since those
# ARE the reference implementation's real e2e-web/e2e-android jobs, not
# twin-specific. run-campaign.ts's own strictly-sequential dispatch loop,
# unchanged by this split, is what still prevents an atomic and a twin
# dispatch from ever hitting the shared OmniPizza backend concurrently — that
# property never depended on the two legs sharing one concurrency group, only
# on the script dispatching one at a time and waiting for completion.)
#
# jobs, inputs, and env below are otherwise verbatim copies of what
# ahm-execution-helix.yml's gate-twin-web / gate-twin-android / eval-twin-web
# / eval-twin-android / resolve-omnipizza-release jobs did — job keys and
# step names are UNCHANGED so scripts/experiments/lib/campaign-matrix.ts's
# JOB_NAME_PREFIXES / PRIMARY_STEP_NAME / artifactNamesFor constants (which
# key off job display names and step names, not which file defines them)
# stay valid without modification.
# =============================================================================

name: AHM — Evaluation Campaign (Non-atomic Twin)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which leg(s) of the non-atomic twin to run'
        required: false
        default: twin
        type: choice
        options: [twin, twin-web, twin-android]
      architecture_type:
        description: 'Pipeline identity — selects the reporting/metrics tail'
        required: false
        default: standard
        type: choice
        options: [standard, TOM]
      experiment_batch_id:
        description: 'Experiment batch id (TOM only — groups repeated runs)'
        required: false
        default: batch-adhoc
      run_index:
        description: 'Run index within the batch (TOM only)'
        required: false
        default: '001'
      cucumber_parallel:
        description: 'Cucumber worker count — twin-web only (the §4.1 parallel-safety sweep uses 1/2/4/8). twin-android always runs at 1, single emulator, and ignores this input.'
        required: false
        default: '4'
      android_api_level:
        description: 'Android API level — twin-android only'
        required: false
        default: '33'
        type: choice
        options: ['28', '29', '30', '31', '32', '33']
      diagnosability_chaos_user:
        description: '§4.2 diagnosability sweep — which seeded OmniPizza account this dispatch logs in as (unset/standard_user = off). Own copy of the input in ahm-execution-helix.yml — see that file for the full rationale.'
        required: false
        default: ''
      tom_inject_fault:
        description: '§4.2 diagnosability sweep — chaos-proxy-layer synthetic failure bucket for this dispatch (see src/kernel/fault-injection.ts). Unset = off, normal routing.'
        required: false
        default: ''
      tom_inject_fault_action:
        description: '§4.2 diagnosability sweep — actionId the injected fault above targets (fires once per proxy process). Required alongside tom_inject_fault, ignored otherwise.'
        required: false
        default: ''
      tom_inject_fault_max_fires:
        description: '§4.2 diagnosability sweep — own copy of the input in ahm-execution-helix.yml. Use 1 here (nonAtomicTwin profile has retry:0) — see that file for the full rationale.'
        required: false
        default: ''
      tom_infra_break_port:
        description: '§4.2 diagnosability sweep, INFRASTRUCTURE_FAILURE bucket only — own copy of the input in ahm-execution-helix.yml, see that file for the full rationale.'
        required: false
        default: ''

# Same shared identity env every TOM-stamped record across the repo's
# workflows carries — see ahm-execution-helix.yml's identical block for the
# full rationale. Harmless no-ops when architecture_type=standard.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ARCHITECTURE_TYPE: ${{ inputs.architecture_type || 'standard' }}
  EXPERIMENT_BATCH_ID: ${{ inputs.experiment_batch_id || 'batch-adhoc' }}
  RUN_INDEX: ${{ inputs.run_index || github.run_attempt }}
  REPOSITORY_NAME: ${{ github.repository }}
  WORKFLOW_RUN_ID: ${{ github.run_id }}
  WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
  COMMIT_SHA: ${{ github.sha }}
  BRANCH_NAME: ${{ github.ref_name }}
  NODE_VERSION: '22'
  LOG_LEVEL: info
  OMNIPIZZA_RELEASES_REPO: gsanchezm/OmniPizza
  PLAYWRIGHT_VERSION: '1.61.1'
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-jammy

# Own group, independent of ahm-execution-helix.yml's `helix-${{ github.ref }}`
# — see the file header for why this is the whole point of the split.
concurrency:
  group: evaluation-campaign-${{ github.ref }}
  cancel-in-progress: true

jobs:

  gate-twin-web:
    name: Gate — Non-atomic Twin (Web)
    runs-on: ubuntu-latest
    if: >-
      inputs.platform == 'twin'
      || inputs.platform == 'twin-web'
    steps:
      - run: echo "Non-atomic twin (web) selected"

  gate-twin-android:
    name: Gate — Non-atomic Twin (Android)
    runs-on: ubuntu-latest
    if: >-
      inputs.platform == 'twin'
      || inputs.platform == 'twin-android'
    steps:
      - run: echo "Non-atomic twin (Android) selected"

  # ---------------------------------------------------------------------------
  # Resolver: latest OmniPizza release — needed only by eval-twin-android (the
  # APK download). Scoped to twin-android/twin here since this file has no
  # other job that would ever need it (contrast ahm-execution-helix.yml's
  # broader resolver, shared across e2e-android/e2e-ios/security-mobsf too).
  # ---------------------------------------------------------------------------
  resolve-omnipizza-release:
    name: Resolve — OmniPizza latest release
    runs-on: ubuntu-latest
    if: >-
      inputs.platform == 'twin'
      || inputs.platform == 'twin-android'
    outputs:
      tag: ${{ steps.fetch.outputs.tag }}
      base_url: ${{ steps.fetch.outputs.base_url }}
    steps:
      - name: Fetch latest release tag
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${OMNIPIZZA_RELEASES_REPO}/releases/latest" \
            | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to resolve latest OmniPizza release tag."
            exit 1
          fi
          BASE_URL="https://github.com/${OMNIPIZZA_RELEASES_REPO}/releases/download/${TAG}"
          echo "Resolved OmniPizza release: $TAG"
          echo "Download base URL: $BASE_URL"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Eval — Non-atomic Twin (Web / Android). Verbatim copies of
  # ahm-execution-helix.yml's eval-twin-web / eval-twin-android jobs — see
  # that file's git history (pre-split) for the original job headers this was
  # lifted from.
  # ---------------------------------------------------------------------------
  eval-twin-web:
    name: Eval — Non-atomic Twin (Web, parallel=${{ inputs.cucumber_parallel || '4' }})
    needs: gate-twin-web
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
      options: --user 0
    env:
      TOOL_NAME: non-atomic-twin-web
      PLATFORM: web
      VIEWPORT: desktop
      DRIVER: playwright
      BROWSER: chromium
      TOM_RUN_ID: >-
        ${{ inputs.architecture_type == 'TOM'
            && format('tom-{0}-{1}-{2}-non-atomic-twin-web', github.run_id, github.run_attempt, inputs.run_index || github.run_attempt)
            || format('gh-{0}-{1}-non-atomic-twin-web', github.run_id, github.run_attempt) }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start proxy + plugins
        shell: bash
        run: bash ci/steps/start-stack.sh web
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BROWSER: chromium
          PLATFORM: web
          VIEWPORT: desktop
          DRIVER: playwright
          HEADLESS: 'true'
          PLAYWRIGHT_ADDRESS: ${{ inputs.tom_infra_break_port != '' && format('127.0.0.1:{0}', inputs.tom_infra_break_port) || '127.0.0.1:50052' }}
          API_ADAPTER_ADDRESS: 127.0.0.1:50055
          PLUGIN_PLAYWRIGHT: 'true'
          PLUGIN_PIXELMATCH: 'false'
          PLUGIN_API: 'true'
          # §4.2 diagnosability — read by the chaos-proxy PROCESS this step launches.
          TOM_INJECT_FAULT: ${{ inputs.tom_inject_fault }}
          TOM_INJECT_FAULT_ACTION: ${{ inputs.tom_inject_fault_action }}
          TOM_INJECT_FAULT_MAX_FIRES: ${{ inputs.tom_inject_fault_max_fires }}

      - name: Stagger start (spread backend login load across the run)
        run: sleep $(( RANDOM % 76 ))

      - name: Capture run start time
        if: always()
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run non-atomic twin
        shell: bash
        run: ./node_modules/.bin/cucumber-js --profile nonAtomicTwin --format "json:reports/non-atomic-twin-web.json" --format progress
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BROWSER: chromium
          CUCUMBER_PARALLEL: ${{ inputs.cucumber_parallel || '4' }}
          PLATFORM: web
          VIEWPORT: desktop
          DRIVER: playwright
          PROXY_ADDRESS: 127.0.0.1:50051
          HEADLESS: 'true'
          PLUGIN_PIXELMATCH: 'false'
          # §4.2 diagnosability — read by the cucumber-js PROCESS this step launches
          # (checkout-nonatomic.steps.ts's loginViaUi call).
          DIAGNOSABILITY_CHAOS_USER: ${{ inputs.diagnosability_chaos_user }}

      - name: Capture run end time
        if: always()
        run: echo "RUN_ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Collect artifacts
        if: always()
        run: bash ci/steps/collect-artifacts.sh non-atomic-twin-web

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ahm-artifacts-${{ github.job }}-${{ github.run_id }}
          path: artifacts/non-atomic-twin-web/
          if-no-files-found: ignore
          retention-days: 30

      - name: Teardown
        if: always()
        run: bash ci/steps/teardown.sh

  eval-twin-android:
    name: Eval — Non-atomic Twin (Android)
    needs: [gate-twin-android, resolve-omnipizza-release]
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: non-atomic-twin-android
      PLATFORM: android
      DRIVER: appium
      TOM_RUN_ID: >-
        ${{ inputs.architecture_type == 'TOM'
            && format('tom-{0}-{1}-{2}-non-atomic-twin-android', github.run_id, github.run_attempt, inputs.run_index || github.run_attempt)
            || format('gh-{0}-{1}-non-atomic-twin-android', github.run_id, github.run_attempt) }}

    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Android platform tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-tools
          adb version

      - name: Download Android app artifact
        env:
          OMNIPIZZA_RELEASE_BASE_URL: ${{ needs.resolve-omnipizza-release.outputs.base_url }}
          OMNIPIZZA_RELEASE_TAG: ${{ needs.resolve-omnipizza-release.outputs.tag }}
        run: |
          mkdir -p assets/apps/android
          echo "Downloading OmniPizza Android APK from release ${OMNIPIZZA_RELEASE_TAG}"
          curl -fL "$OMNIPIZZA_RELEASE_BASE_URL/omnipizza-release.apk" \
            -o assets/apps/android/app-release.apk
          ls -lh assets/apps/android/app-release.apk

      - name: Start MinIO Telemetry Storage
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose -f infrastructure/minio-compose.yml up -d
          else
            docker-compose -f infrastructure/minio-compose.yml up -d
          fi
          sleep 5

      - name: Start Android emulator (docker-android)
        run: |
          docker run -d \
            --name android-emulator \
            --privileged \
            --device /dev/kvm \
            -p 5554:5554 \
            -p 5555:5555 \
            -e API_LEVEL=${{ inputs.android_api_level || '33' }} \
            -e IMG_TYPE=google_apis \
            -e ARCHITECTURE=x86_64 \
            -e DEVICE_ID=pixel \
            -e MEMORY=4096 \
            -e CORES=2 \
            -e DISABLE_ANIMATION=true \
            -e DISABLE_HIDDEN_POLICY=true \
            -e SKIP_AUTH=1 \
            halimqarroum/docker-android:api-${{ inputs.android_api_level || '33' }}

      - name: Start Appium server
        run: |
          pnpm exec appium --relaxed-security &
          sleep 5

      - name: Wait for emulator to be ready
        run: |
          echo "Waiting for ADB device to appear..."
          adb connect localhost:5555
          for i in $(seq 1 40); do
            if adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
              echo "Emulator ready after $((i * 15))s"
              break
            fi
            echo "  Attempt $i/40 — waiting 15s..."
            sleep 15
          done
          adb devices
          adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q "1" \
            || { echo "Emulator did not report boot_completed within 600s"; exit 1; }

      - name: Start proxy + Appium plugin
        run: bash ci/steps/start-stack.sh android
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PLATFORM: android
          DRIVER: appium
          APPIUM_HOST: localhost
          APPIUM_PORT: '4723'
          CAP_PROFILE: docker_android
          ANDROID_APP_PATH: assets/apps/android/app-release.apk
          ANDROID_UDID: localhost:5555
          PLUGIN_APPIUM: 'true'
          PLUGIN_API: 'true'
          # §4.2 diagnosability — see eval-twin-web's identical comment above.
          TOM_INJECT_FAULT: ${{ inputs.tom_inject_fault }}
          TOM_INJECT_FAULT_ACTION: ${{ inputs.tom_inject_fault_action }}
          TOM_INJECT_FAULT_MAX_FIRES: ${{ inputs.tom_inject_fault_max_fires }}
          APPIUM_ADDRESS: ${{ inputs.tom_infra_break_port != '' && format('127.0.0.1:{0}', inputs.tom_infra_break_port) || '127.0.0.1:50053' }}

      - name: Stagger start (spread backend login load across the run)
        run: sleep $(( RANDOM % 76 ))

      - name: Capture run start time
        if: always()
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run non-atomic twin
        shell: bash
        run: ./node_modules/.bin/cucumber-js --profile nonAtomicTwin --format "json:reports/non-atomic-twin-android.json" --format progress
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PLATFORM: android
          DRIVER: appium
          APPIUM_HOST: localhost
          APPIUM_PORT: '4723'
          CAP_PROFILE: docker_android
          ANDROID_APP_PATH: assets/apps/android/app-release.apk
          ANDROID_UDID: localhost:5555
          MINIO_ENDPOINT: localhost
          MINIO_PORT: '9000'
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          # §4.2 diagnosability — see eval-twin-web's identical comment above.
          DIAGNOSABILITY_CHAOS_USER: ${{ inputs.diagnosability_chaos_user }}

      - name: Capture run end time
        if: always()
        run: echo "RUN_ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Show Android emulator logs
        if: failure()
        run: |
          docker ps -a --filter name=android-emulator
          if docker ps -a --format '{{.Names}}' | grep -qx android-emulator; then
            docker logs --tail 200 android-emulator
          else
            echo "android-emulator container was not created."
          fi

      - name: Collect artifacts
        if: always()
        run: bash ci/steps/collect-artifacts.sh non-atomic-twin-android

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ahm-artifacts-${{ github.job }}-${{ github.run_id }}
          path: artifacts/non-atomic-twin-android/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop emulator
        if: always()
        run: docker rm -f android-emulator || true

      - name: Teardown
        if: always()
        run: bash ci/steps/teardown.sh
